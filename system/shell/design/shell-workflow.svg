<svg viewBox="0 0 940 729" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Verdana, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="0" y="0" width="940" height="729" fill="#ffffff"/>
<text x="470" y="28" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">system/shell/ — Detailed Workflow</text>
<text x="470" y="48" text-anchor="middle" font-size="12" fill="#64748b">Implemented and host-tested — not yet wired into the boot path; BusyBox /bin/sh runs today</text>
<rect x="110" y="78" width="720" height="49" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="470" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">1. Composition root constructs the shell</text>
<text x="470" y="115" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#374151">main_shell(): CommandParser + BuiltinCommands + ProcessManager + Logger</text>
<line x1="470" y1="127" x2="470" y2="167" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="167" width="720" height="49" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="470" y="189" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">2. Shell::run() starts the REPL loop</text>
<text x="470" y="204" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#374151">prints "neytra&gt; ", reads a line via std::getline(std::cin, ...)</text>
<line x1="470" y1="216" x2="470" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="256" width="720" height="65" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="470" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">3. CommandParser::parse(line)</text>
<text x="470" y="293" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#374151">quote-aware tokenizer -- handles 'single' and "double" quotes</text>
<text x="470" y="310" text-anchor="middle" font-size="10" font-style="italic" fill="#1d4ed8">blank lines and # comments parse as invalid (skipped)</text>
<line x1="470" y1="321" x2="470" y2="361" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="361" width="720" height="49" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="470" y="383" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">4. BuiltinCommands::isBuiltin(command)</text>
<text x="470" y="398" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#374151">cd, pwd, echo, export, unset, env, exit, help</text>
<line x1="470" y1="410" x2="470" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="450" width="720" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="470" y="472" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">5. Dispatch the command</text>
<text x="470" y="487" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#374151">builtin  -&gt; BuiltinCommands::run(cmd, args, shouldExit)</text>
<text x="470" y="502" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#374151">external -&gt; ProcessManager::spawn() + wait()</text>
<line x1="470" y1="514" x2="470" y2="554" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="554" width="720" height="65" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="470" y="576" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">6. Print result, loop back</text>
<text x="470" y="591" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#374151">until BuiltinCommands sets shouldExit=true (the "exit" builtin)</text>
<text x="470" y="608" text-anchor="middle" font-size="10" font-style="italic" fill="#1d4ed8">today: BusyBox /bin/sh fills this role at boot -- see rootfs/init</text>
<line x1="110" y1="649" x2="830" y2="649" stroke="#e2e8f0" stroke-width="1"/>
<rect x="110" y="663" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="144" y="676" font-size="11" fill="#1f2937">Implemented &amp; active</text>
<text x="470" y="719" text-anchor="middle" font-size="10" fill="#94a3b8">Neytra OS &#183; shell-workflow.svg</text>
</svg>