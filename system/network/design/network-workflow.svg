<svg viewBox="0 0 940 730" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Verdana, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="0" y="0" width="940" height="730" fill="#ffffff"/>
<text x="470" y="28" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">system/network/ — Detailed Workflow</text>
<text x="470" y="48" text-anchor="middle" font-size="12" fill="#64748b">Implemented and host-tested — real sockets/interfaces/DHCP; WifiManager scan is an honest no-op (no wireless hardware)</text>
<rect x="110" y="78" width="720" height="49" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="470" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">1. NetworkManager::listInterfaces()</text>
<text x="470" y="115" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#374151">real getifaddrs(3) -- always finds at least "lo" on any Linux host</text>
<line x1="470" y1="127" x2="470" y2="167" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="167" width="720" height="65" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="470" y="189" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">2. NetworkManager::setInterfaceUp(name, true)</text>
<text x="470" y="204" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#374151">real ioctl(SIOCGIFFLAGS/SIOCSIFFLAGS)</text>
<text x="470" y="221" text-anchor="middle" font-size="10" font-style="italic" fill="#1d4ed8">needs CAP_NET_ADMIN; fails gracefully (logged) without it</text>
<line x1="470" y1="232" x2="470" y2="272" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="272" width="720" height="65" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="470" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">3. DHCPClient::acquire(iface, lease, timeout)</text>
<text x="470" y="309" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#374151">real RFC 2131: DISCOVER -&gt; OFFER -&gt; REQUEST -&gt; ACK over raw UDP</text>
<text x="470" y="326" text-anchor="middle" font-size="10" font-style="italic" fill="#1d4ed8">binds port 68 (needs root); times out if no DHCP server replies</text>
<line x1="470" y1="337" x2="470" y2="377" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="377" width="720" height="49" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="470" y="399" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">4. WifiManager::listWirelessInterfaces()</text>
<text x="470" y="414" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#374151">real check: does /sys/class/net/&lt;if&gt;/wireless exist?</text>
<line x1="470" y1="426" x2="470" y2="466" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="466" width="720" height="65" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="7,5"/>
<text x="470" y="488" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">5. WifiManager::scan(iface)</text>
<text x="470" y="503" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#374151">full nl80211 scanning not implemented -- honestly returns empty</text>
<text x="470" y="520" text-anchor="middle" font-size="10" font-style="italic" fill="#92400e">no wireless hardware on the QEMU x86_64 target to test against</text>
<line x1="470" y1="531" x2="470" y2="571" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="571" width="720" height="49" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="470" y="593" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">6. SocketManager</text>
<text x="470" y="608" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#374151">real socket()/bind()/connect()/send()/recv() -- used by Downloader too</text>
<line x1="110" y1="650" x2="830" y2="650" stroke="#e2e8f0" stroke-width="1"/>
<rect x="110" y="664" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="144" y="677" font-size="11" fill="#1f2937">Implemented &amp; active</text>
<rect x="470" y="664" width="26" height="16" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="7,5"/>
<text x="504" y="677" font-size="11" fill="#1f2937">Planned / stub only</text>
<text x="470" y="720" text-anchor="middle" font-size="10" fill="#94a3b8">Neytra OS &#183; network-workflow.svg</text>
</svg>