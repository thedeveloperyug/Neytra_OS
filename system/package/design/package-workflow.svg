<svg viewBox="0 0 940 698" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Verdana, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="0" y="0" width="940" height="698" fill="#ffffff"/>
<text x="470" y="28" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">system/package/ — Detailed Workflow</text>
<text x="470" y="48" text-anchor="middle" font-size="12" fill="#64748b">Implemented and host-tested end to end, including a real HTTP download and real tar extraction</text>
<rect x="110" y="78" width="720" height="49" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="7,5"/>
<text x="470" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">1. Shell / user requests an install</text>
<text x="470" y="115" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#374151">e.g. neytra&gt; pkg install &lt;name&gt;  (Shell has no "pkg" builtin yet)</text>
<line x1="470" y1="127" x2="470" y2="167" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="167" width="720" height="49" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="470" y="189" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">2. PackageManager::install(name)</text>
<text x="470" y="204" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#374151">top-level coordinator for install / remove / query</text>
<line x1="470" y1="216" x2="470" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="256" width="720" height="49" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="470" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">3. Repository::find(name)</text>
<text x="470" y="293" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#374151">looks up name|version|url in the loaded flat-file index</text>
<line x1="470" y1="305" x2="470" y2="345" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="345" width="720" height="65" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="470" y="367" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">4. Downloader::fetch(url, path)</text>
<text x="470" y="382" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#374151">real HTTP/1.1 GET over a raw TCP socket (via SocketManager)</text>
<text x="470" y="399" text-anchor="middle" font-size="10" font-style="italic" fill="#1d4ed8">no TLS -- http:// only</text>
<line x1="470" y1="410" x2="470" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="450" width="720" height="49" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="470" y="472" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">5. Installer::install(archive, destDir)</text>
<text x="470" y="487" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#374151">spawns the real `tar` binary via IProcessManager</text>
<line x1="470" y1="499" x2="470" y2="539" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="539" width="720" height="49" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="470" y="561" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">6. PackageManager records installed state</text>
<text x="470" y="576" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#374151">in-memory installed set; isInstalled()/remove() query and mutate it</text>
<line x1="110" y1="618" x2="830" y2="618" stroke="#e2e8f0" stroke-width="1"/>
<rect x="110" y="632" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="144" y="645" font-size="11" fill="#1f2937">Implemented &amp; active</text>
<rect x="470" y="632" width="26" height="16" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="7,5"/>
<text x="504" y="645" font-size="11" fill="#1f2937">Planned / stub only</text>
<text x="470" y="688" text-anchor="middle" font-size="10" fill="#94a3b8">Neytra OS &#183; package-workflow.svg</text>
</svg>