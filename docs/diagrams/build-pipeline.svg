<svg viewBox="0 0 1000 840" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Verdana, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="840" fill="#ffffff"/>

  <text x="500" y="28" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Neytra OS — Build &amp; Run Pipeline</text>
  <text x="500" y="48" text-anchor="middle" font-size="12.5" fill="#64748b">Two tracks (kernel + rootfs) merge into a QEMU boot; SD-card flashing is the planned alternate path</text>

  <text x="265" y="74" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">Kernel Track</text>
  <text x="735" y="74" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">Rootfs Track</text>

  <!-- K1 / R1 -->
  <rect x="40" y="90" width="452" height="56" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="266" y="109" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Fetch Kernel Source</text>
  <text x="266" y="124" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#374151">git clone torvalds/linux → kernel/linux</text>
  <text x="266" y="138" text-anchor="middle" font-size="9" font-style="italic" fill="#1d4ed8">ACTIVE — README Phase 2, Step 5</text>

  <rect x="508" y="90" width="452" height="56" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="734" y="109" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Create Rootfs Skeleton</text>
  <text x="734" y="124" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#374151">mkdir rootfs/{bin,sbin,etc,proc,sys,dev,tmp,usr}</text>
  <text x="734" y="138" text-anchor="middle" font-size="9" font-style="italic" fill="#1d4ed8">ACTIVE — scripts/build_rootfs.sh</text>

  <line x1="266" y1="146" x2="266" y2="166" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="734" y1="146" x2="734" y2="166" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- K2 / R2 -->
  <rect x="40" y="166" width="452" height="56" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="266" y="185" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Configure Kernel</text>
  <text x="266" y="200" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#374151">make defconfig  →  kernel/linux/.config</text>
  <text x="266" y="214" text-anchor="middle" font-size="9" font-style="italic" fill="#1d4ed8">ACTIVE — x86_64 config present</text>

  <rect x="508" y="166" width="452" height="56" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="734" y="185" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Install BusyBox</text>
  <text x="734" y="200" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#374151">rootfs/bin/busybox + symlinked applets</text>
  <text x="734" y="214" text-anchor="middle" font-size="9" font-style="italic" fill="#1d4ed8">ACTIVE — BusyBox v1.36.1 static</text>

  <line x1="266" y1="222" x2="266" y2="242" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="734" y1="222" x2="734" y2="242" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- K3 / R3 -->
  <rect x="40" y="242" width="452" height="56" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="266" y="261" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Compile Kernel</text>
  <text x="266" y="276" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#374151">make -j$(nproc)</text>
  <text x="266" y="290" text-anchor="middle" font-size="9" font-style="italic" fill="#1d4ed8">ACTIVE — run manually (build_kernel.sh is a placeholder)</text>

  <rect x="508" y="242" width="452" height="56" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="734" y="261" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Write Init &amp; Config</text>
  <text x="734" y="276" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#374151">rootfs/init, etc/inittab, hostname, motd</text>
  <text x="734" y="290" text-anchor="middle" font-size="9" font-style="italic" fill="#1d4ed8">ACTIVE</text>

  <line x1="266" y1="298" x2="266" y2="318" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="734" y1="298" x2="734" y2="318" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- K4 / R4 -->
  <rect x="40" y="318" width="452" height="56" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="266" y="337" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Kernel Artifacts</text>
  <text x="266" y="352" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#374151">arch/x86/boot/bzImage + vmlinux (52MB)</text>
  <text x="266" y="366" text-anchor="middle" font-size="9" font-style="italic" fill="#15803d">Linux 7.1.0-rc3 "Baby Opossum Posse"</text>

  <rect x="508" y="318" width="452" height="56" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="734" y="337" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Package Initramfs</text>
  <text x="734" y="352" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#374151">find . | cpio -H newc -o | gzip</text>
  <text x="734" y="366" text-anchor="middle" font-size="9" font-style="italic" fill="#1d4ed8">→ output/initramfs.cpio.gz</text>

  <!-- merge -->
  <line x1="266" y1="374" x2="266" y2="392" stroke="#475569" stroke-width="2"/>
  <line x1="734" y1="374" x2="734" y2="392" stroke="#475569" stroke-width="2"/>
  <line x1="266" y1="392" x2="734" y2="392" stroke="#475569" stroke-width="2"/>
  <line x1="500" y1="392" x2="500" y2="408" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- QEMU node -->
  <rect x="220" y="408" width="560" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="500" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">scripts/run_qemu_x86.sh</text>
  <text x="500" y="447" text-anchor="middle" font-size="9.5" font-family="Consolas, monospace" fill="#374151">qemu-system-x86_64 -kernel bzImage -initrd initramfs.cpio.gz</text>
  <text x="500" y="461" text-anchor="middle" font-size="9.5" font-family="Consolas, monospace" fill="#374151">-m 512M -smp 2 -enable-kvm -append "console=ttyS0 init=/init"</text>

  <line x1="500" y1="472" x2="500" y2="502" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- END -->
  <rect x="260" y="502" width="480" height="54" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
  <text x="500" y="526" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">Boot Console (ttyS0) — Neytra OS Shell</text>
  <text x="500" y="544" text-anchor="middle" font-size="10.5" fill="#1d4ed8">ACTIVE — reproducible today end-to-end</text>

  <!-- branch connector down to RPi row (routed right of the main trunk to avoid crossing it) -->
  <line x1="960" y1="346" x2="980" y2="346" stroke="#d97706" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="980" y1="346" x2="980" y2="605" stroke="#d97706" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="980" y1="605" x2="145" y2="605" stroke="#d97706" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="145" y1="605" x2="145" y2="622" stroke="#d97706" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow3)"/>

  <line x1="40" y1="590" x2="960" y2="590" stroke="#e2e8f0" stroke-width="1"/>
  <text x="500" y="614" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">Alternate / Planned Path — Raspberry Pi 4B Physical Boot</text>

  <!-- RPi row -->
  <rect x="40" y="626" width="218" height="60" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="149" y="646" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">Assemble Boot Files</text>
  <text x="149" y="661" text-anchor="middle" font-size="9" fill="#374151">initramfs + kernel8.img + *.dtb → boot/</text>
  <text x="149" y="675" text-anchor="middle" font-size="8.5" font-style="italic" fill="#92400e">kernel8.img not built by repo yet</text>

  <line x1="258" y1="656" x2="273" y2="656" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="273" y="626" width="218" height="60" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="382" y="646" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">create_image.sh</text>
  <text x="382" y="661" text-anchor="middle" font-size="9" fill="#374151">→ output/images/*.img</text>
  <text x="382" y="675" text-anchor="middle" font-size="8.5" font-style="italic" fill="#92400e">PLACEHOLDER</text>

  <line x1="491" y1="656" x2="506" y2="656" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="506" y="626" width="218" height="60" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="615" y="646" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">flash_sd.sh</text>
  <text x="615" y="661" text-anchor="middle" font-size="9" fill="#374151">→ write image to physical SD card</text>
  <text x="615" y="675" text-anchor="middle" font-size="8.5" font-style="italic" fill="#92400e">PLACEHOLDER</text>

  <line x1="724" y1="656" x2="739" y2="656" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="739" y="626" width="218" height="60" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="848" y="646" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">Raspberry Pi 4B</text>
  <text x="848" y="661" text-anchor="middle" font-size="9" fill="#374151">real hardware boot</text>
  <text x="848" y="675" text-anchor="middle" font-size="8.5" font-style="italic" fill="#92400e">PLANNED</text>

  <!-- legend -->
  <line x1="40" y1="712" x2="960" y2="712" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="728" width="28" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="76" y="741" font-size="11.5" fill="#1f2937">Implemented &amp; active today</text>
  <rect x="500" y="728" width="28" height="18" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="536" y="741" font-size="11.5" fill="#1f2937">Planned / placeholder script</text>
  <rect x="40" y="762" width="28" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="76" y="775" font-size="11.5" fill="#1f2937">Kernel build output</text>

  <text x="500" y="812" text-anchor="middle" font-size="10.5" fill="#94a3b8">Neytra OS · docs/diagrams/build-pipeline.svg</text>
</svg>
