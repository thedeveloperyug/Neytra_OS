  <!-- legend -->
  <line x1="40" y1="500" x2="960" y2="500" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="516" width="28" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="76" y="529" font-size="11.5" fill="#1f2937">Real, active code today</text>
  <rect x="500" y="516" width="28" height="18" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="536" y="529" font-size="11.5" fill="#1f2937">Planned — empty stub class, no logic</text>
  <text x="500" y="565" text-anchor="middle" font-size="10" fill="#6b7280">Arrows show a proposed ownership hierarchy inferred from directory layout — not yet expressed in code.</text>

  <text x="500" y="615" text-anchor="middle" font-size="10.5" fill="#94a3b8">Neytra OS · docs/diagrams/subsystem-map.svg</text>
</svg>
