    <rect x="572" y="340" width="121" height="140" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="633" y="362" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">Security</text>
    <text x="633" y="376" text-anchor="middle" font-size="7.5" fill="#92400e">system/security/</text>
    <text x="633" y="392" text-anchor="middle">UserManager</text>
    <text x="633" y="406" text-anchor="middle">PermissionManager</text>
    <text x="633" y="420" text-anchor="middle">Sandbox</text>
    <text x="633" y="468" text-anchor="middle" font-size="8.5" font-style="italic" fill="#92400e">planned</text>

    <!-- Drivers -->
    <rect x="705" y="340" width="121" height="140" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="766" y="362" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">Drivers</text>
    <text x="766" y="376" text-anchor="middle" font-size="7.5" fill="#92400e">system/drivers/</text>
    <text x="766" y="396" text-anchor="middle">GPIO · I2C</text>
    <text x="766" y="410" text-anchor="middle">SPI · UART</text>
    <text x="766" y="468" text-anchor="middle" font-size="8.5" font-style="italic" fill="#92400e">planned (RPi HAL)</text>

    <!-- GUI -->
    <rect x="838" y="340" width="121" height="140" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="899" y="362" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">GUI</text>
    <text x="899" y="376" text-anchor="middle" font-size="7.5" fill="#92400e">system/gui/</text>
    <text x="899" y="392" text-anchor="middle">WindowManager</text>
    <text x="899" y="406" text-anchor="middle">Desktop · Renderer</text>
    <text x="899" y="420" text-anchor="middle">Framebuffer</text>
    <text x="899" y="468" text-anchor="middle" font-size="8.5" font-style="italic" fill="#92400e">planned</text>
