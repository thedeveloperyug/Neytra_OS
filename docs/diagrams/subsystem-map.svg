<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Verdana, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="650" fill="#ffffff"/>

  <text x="500" y="28" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Neytra OS — system/ Subsystem Map</text>
  <text x="500" y="48" text-anchor="middle" font-size="12.5" fill="#64748b">Planned C++ architecture inferred from folder layout — every class below is currently an empty stub</text>

  <!-- entry point -->
  <rect x="360" y="70" width="280" height="46" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">system/init/main.cpp</text>
  <text x="500" y="103" text-anchor="middle" font-size="9.5" font-family="Consolas, monospace" fill="#1d4ed8">int main_init() { return 0; }</text>
  <line x1="500" y1="116" x2="500" y2="136" stroke="#475569" stroke-width="2" marker-end="url(#arrow5)"/>

  <!-- InitManager -->
  <rect x="360" y="136" width="280" height="54" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="500" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">InitManager</text>
  <text x="500" y="172" text-anchor="middle" font-size="9.5" fill="#374151">system/init/InitManager.hpp / .cpp</text>
  <text x="500" y="184" text-anchor="middle" font-size="8.5" font-style="italic" fill="#92400e">planned — empty class today</text>

  <!-- fan to row1 -->
  <line x1="500" y1="190" x2="170" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="500" y1="190" x2="500" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="500" y1="190" x2="830" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrow5)"/>

  <!-- Row1 -->
  <rect x="40" y="220" width="260" height="70" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="170" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">MountManager</text>
  <text x="170" y="259" text-anchor="middle" font-size="9.5" fill="#374151">system/init/MountManager.*</text>
  <text x="170" y="273" text-anchor="middle" font-size="8.5" font-style="italic" fill="#92400e">planned — empty class today</text>

  <rect x="370" y="220" width="260" height="70" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="500" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">ServiceManager</text>
  <text x="500" y="259" text-anchor="middle" font-size="9.5" fill="#374151">system/init/ServiceManager.*</text>
  <text x="500" y="273" text-anchor="middle" font-size="8.5" font-style="italic" fill="#92400e">planned — starts subsystems below</text>

  <rect x="700" y="220" width="260" height="70" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="830" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Logger</text>
  <text x="830" y="259" text-anchor="middle" font-size="9.5" fill="#374151">system/logger/Logger.*</text>
  <text x="830" y="273" text-anchor="middle" font-size="8.5" font-style="italic" fill="#92400e">planned — empty class today</text>

  <!-- bus to subsystem cards -->
  <line x1="500" y1="290" x2="500" y2="315" stroke="#475569" stroke-width="2"/>
  <line x1="100" y1="315" x2="899" y2="315" stroke="#475569" stroke-width="2"/>
  <line x1="100" y1="315" x2="100" y2="340" stroke="#475569" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="234" y1="315" x2="234" y2="340" stroke="#475569" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="367" y1="315" x2="367" y2="340" stroke="#475569" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="500" y1="315" x2="500" y2="340" stroke="#475569" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="633" y1="315" x2="633" y2="340" stroke="#475569" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="766" y1="315" x2="766" y2="340" stroke="#475569" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="899" y1="315" x2="899" y2="340" stroke="#475569" stroke-width="2" marker-end="url(#arrow5)"/>

