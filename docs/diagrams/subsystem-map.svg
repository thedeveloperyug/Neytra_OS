    <text x="100" y="376" text-anchor="middle" font-size="7.5" fill="#92400e">system/shell/</text>
    <text x="100" y="392" text-anchor="middle">Shell</text>
    <text x="100" y="406" text-anchor="middle">CommandParser</text>
    <text x="100" y="420" text-anchor="middle">BuiltinCommands</text>
    <text x="100" y="468" text-anchor="middle" font-size="8.5" font-style="italic" fill="#92400e">planned</text>

    <!-- Process -->
    <rect x="173" y="340" width="121" height="140" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="234" y="362" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">Process</text>
    <text x="234" y="376" text-anchor="middle" font-size="7.5" fill="#92400e">system/process/</text>
    <text x="234" y="392" text-anchor="middle">ProcessManager</text>
    <text x="234" y="406" text-anchor="middle">Scheduler</text>
    <text x="234" y="420" text-anchor="middle">IPC</text>
    <text x="234" y="468" text-anchor="middle" font-size="8.5" font-style="italic" fill="#92400e">planned</text>

