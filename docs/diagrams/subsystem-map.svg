    <text x="367" y="362" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">Network</text>
    <text x="367" y="376" text-anchor="middle" font-size="7.5" fill="#92400e">system/network/</text>
    <text x="367" y="392" text-anchor="middle">NetworkManager</text>
    <text x="367" y="406" text-anchor="middle">DHCPClient</text>
    <text x="367" y="420" text-anchor="middle">WifiManager</text>
    <text x="367" y="434" text-anchor="middle">SocketManager</text>
    <text x="367" y="468" text-anchor="middle" font-size="8.5" font-style="italic" fill="#92400e">planned</text>

    <!-- Package -->
    <rect x="439" y="340" width="121" height="140" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="500" y="362" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">Package</text>
    <text x="500" y="376" text-anchor="middle" font-size="7.5" fill="#92400e">system/package/</text>
    <text x="500" y="392" text-anchor="middle">PackageManager</text>
    <text x="500" y="406" text-anchor="middle">Downloader</text>
    <text x="500" y="420" text-anchor="middle">Installer</text>
    <text x="500" y="434" text-anchor="middle">Repository</text>
    <text x="500" y="468" text-anchor="middle" font-size="8.5" font-style="italic" fill="#92400e">planned</text>

